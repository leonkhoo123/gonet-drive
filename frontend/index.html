<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoNet Drive</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/api/config/logo" />

    <!-- PWA manifest (dynamically served by backend with configured service name) -->
    <link rel="manifest" href="/api/config/manifest" />

    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function() {
        var theme = localStorage.getItem('vite-ui-theme');
        var isDark = theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', isDark ? '#0a0a0a' : '#ffffff');
        var iosMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (iosMeta) iosMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
      })();
    </script>

    <!-- Optional: better iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
