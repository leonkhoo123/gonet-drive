definitions:
  controller.UpdateConfigRequest:
    properties:
      config_value:
        type: string
      is_deleted:
        type: boolean
      is_enabled:
        type: boolean
    type: object
  model.AudioPath:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_enabled:
        type: boolean
      path:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.CloudConfig:
    properties:
      config_name:
        type: string
      config_type:
        type: string
      config_unit:
        type: string
      config_value:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      is_enabled:
        type: boolean
    type: object
  service.AudioBookItem:
    properties:
      last_modified:
        type: string
      mediaType:
        type: string
      name:
        type: string
      progress_time:
        type: number
      size:
        type: integer
      total_length:
        description: in seconds
        type: number
      url:
        type: string
    type: object
  service.CancelReq:
    properties:
      cancel:
        description: optional explicit cancel flag
        type: boolean
      opId:
        type: string
    required:
    - opId
    type: object
  service.CheckDuplicateReq:
    properties:
      destDir:
        type: string
      sources:
        items:
          type: string
        type: array
    required:
    - destDir
    - sources
    type: object
  service.CheckUploadDuplicateReq:
    properties:
      destDir:
        type: string
      files:
        items:
          $ref: '#/definitions/service.UploadFileDetail'
        type: array
    required:
    - destDir
    - files
    type: object
  service.CopyReq:
    properties:
      destDir:
        type: string
      opId:
        description: 'Optional: client provided operation ID'
        type: string
      sources:
        items:
          type: string
        type: array
    required:
    - destDir
    - sources
    type: object
  service.CreateFolderReq:
    properties:
      dir:
        type: string
      folderName:
        type: string
      opId:
        type: string
    required:
    - folderName
    type: object
  service.CreateShareRequest:
    properties:
      authority:
        type: string
      description:
        type: string
      expires_in_hours:
        type: integer
      path:
        type: string
    required:
    - description
    - expires_in_hours
    - path
    type: object
  service.DeleteReq:
    properties:
      opId:
        type: string
      sources:
        items:
          type: string
        type: array
    required:
    - sources
    type: object
  service.MFAVerifyRequest:
    properties:
      code:
        type: string
      device_id:
        type: string
    type: object
  service.MoveReq:
    properties:
      destDir:
        type: string
      opId:
        type: string
      sources:
        items:
          type: string
        type: array
    required:
    - destDir
    - sources
    type: object
  service.PathReq:
    properties:
      is_enabled:
        type: boolean
      path:
        type: string
    type: object
  service.ProgressReq:
    properties:
      audiobook_name:
        type: string
      progress_time:
        type: number
    type: object
  service.PropertiesContains:
    properties:
      files:
        type: integer
      folders:
        type: integer
    type: object
  service.PropertiesReq:
    properties:
      sources:
        items:
          type: string
        type: array
    required:
    - sources
    type: object
  service.PropertiesResponse:
    properties:
      accessedAt:
        type: string
      contains:
        $ref: '#/definitions/service.PropertiesContains'
      createdAt:
        type: string
      location:
        type: string
      modifiedAt:
        type: string
      name:
        description: null if multiple
        type: string
      totalSizeBytes:
        type: integer
      type:
        description: '"file", "directory", or "multiple"'
        type: string
    type: object
  service.RenameReq:
    properties:
      newName:
        type: string
      opId:
        type: string
      source:
        type: string
    required:
    - newName
    - source
    type: object
  service.UploadFileDetail:
    properties:
      modifiedAt:
        type: string
      path:
        description: relative path including filename
        type: string
      size:
        type: integer
    type: object
  service.VerifyShareRequest:
    properties:
      id:
        type: string
      pin:
        type: string
    required:
    - id
    - pin
    type: object
host: localhost:3333
info:
  contact:
    name: GoNet Drive Support
    url: https://github.com
  description: GoNet Drive is a self-hosted cloud file storage and sharing service.
  termsOfService: https://example.com/terms
  title: GoNet Drive API
  version: "1.0"
paths:
  /api/config/logo:
    get:
      description: Return the service logo image file.
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get Logo
      tags:
      - Config
  /api/config/manifest:
    get:
      description: Return the Progressive Web App manifest JSON.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get PWA Manifest
      tags:
      - Config
  /api/health:
    get:
      description: Get service health status and configuration info.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Health Check
      tags:
      - System
  /api/share/check-permission/{id}:
    get:
      description: Verify that a valid share JWT exists for the given share ID and
        the share is still active.
      parameters:
      - description: Share ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Check Share Permission
      tags:
      - Share
  /api/share/file/{mediaType}/play/file/{filepath}:
    get:
      description: Serve media files (video, photo, music, document) from a shared
        path.
      parameters:
      - description: Relative file path
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Serve Share Media
      tags:
      - Share Files
  /api/share/file/copy:
    post:
      consumes:
      - application/json
      parameters:
      - description: Copy request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CopyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Copy Files in Share
      tags:
      - Share Files
  /api/share/file/create-folder:
    post:
      consumes:
      - application/json
      parameters:
      - description: Create folder request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreateFolderReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Create Folder in Share
      tags:
      - Share Files
  /api/share/file/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: Delete request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.DeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Soft Delete Share Files
      tags:
      - Share Files
  /api/share/file/delete-permanent:
    post:
      consumes:
      - application/json
      parameters:
      - description: Delete request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.DeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Permanent Delete Share Files
      tags:
      - Share Files
  /api/share/file/download:
    get:
      description: Download one or more files/directories from a shared path. Single
        files are served directly; multiple items are packaged as ZIP.
      parameters:
      - collectionFormat: csv
        description: Source file paths
        in: query
        items:
          type: string
        name: source
        required: true
        type: array
      - description: Share ID
        in: header
        name: X-Share-Id
        type: string
      - description: Share ID (alternative)
        in: query
        name: share_id
        type: string
      produces:
      - application/octet-stream
      - application/zip
      responses:
        "200":
          description: OK
          schema:
            type: file
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Download Share Files
      tags:
      - Share Files
  /api/share/file/list:
    get:
      description: List files and directories within the authorized share path.
      parameters:
      - description: Directory path
        in: query
        name: path
        type: string
      - description: 'Sort by: name, size, modified'
        in: query
        name: sort
        type: string
      - description: 'Sort order: asc, desc'
        in: query
        name: order
        type: string
      - description: 'Show hidden files: true, false'
        in: query
        name: showHidden
        type: string
      - description: Share ID
        in: header
        name: X-Share-Id
        type: string
      - description: Share ID (alternative)
        in: query
        name: share_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: List Share Files
      tags:
      - Share Files
  /api/share/file/move:
    post:
      consumes:
      - application/json
      parameters:
      - description: Move request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.MoveReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Move Files in Share
      tags:
      - Share Files
  /api/share/file/properties:
    post:
      consumes:
      - application/json
      description: Get metadata for files/directories in a shared path.
      parameters:
      - description: Share ID
        in: header
        name: X-Share-Id
        type: string
      - description: Share ID (alternative)
        in: query
        name: share_id
        type: string
      - description: Properties request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.PropertiesReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PropertiesResponse'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Share File Properties
      tags:
      - Share Files
  /api/share/file/rename:
    post:
      consumes:
      - application/json
      parameters:
      - description: Rename request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RenameReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Rename File in Share
      tags:
      - Share Files
  /api/share/file/upload-chunk:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file chunk to a shared path. Requires modify authority.
      parameters:
      - description: Upload identifier
        in: formData
        name: identifier
        required: true
        type: string
      - description: 'Chunk status: start, uploading, end, cancel'
        in: formData
        name: status
        required: true
        type: string
      - description: Target filename
        in: formData
        name: filename
        required: true
        type: string
      - description: Destination directory
        in: formData
        name: destination
        required: true
        type: string
      - description: Chunk number (1-indexed)
        in: formData
        name: chunkNumber
        required: true
        type: integer
      - description: Total number of chunks
        in: formData
        name: totalChunks
        required: true
        type: integer
      - description: Chunk checksum
        in: formData
        name: checksum
        type: string
      - description: The chunk file data
        in: formData
        name: chunk
        required: true
        type: file
      - description: Share ID
        in: header
        name: X-Share-Id
        type: string
      - description: Share ID (alternative)
        in: query
        name: share_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - ShareAuth: []
      summary: Upload to Share
      tags:
      - Share Files
  /api/share/verify:
    post:
      consumes:
      - application/json
      description: Verify a share link ID and PIN. On success, a share JWT cookie
        is set for subsequent access.
      parameters:
      - description: Share ID and PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.VerifyShareRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "410":
          description: Gone
          schema:
            additionalProperties: true
            type: object
      summary: Verify Share PIN
      tags:
      - Share
  /api/user/admin/config/logo:
    put:
      consumes:
      - multipart/form-data
      description: Upload a new PNG logo file. Requires admin role.
      parameters:
      - description: PNG logo file
        in: formData
        name: logo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Update Logo
      tags:
      - Admin
  /api/user/audiobook/filelist:
    get:
      parameters:
      - description: Directory path
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Audiobook File List
      tags:
      - Audiobooks
  /api/user/audiobook/list:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.AudioBookItem'
            type: array
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: List Audiobooks
      tags:
      - Audiobooks
  /api/user/audiobook/path:
    post:
      consumes:
      - application/json
      parameters:
      - description: Path request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.PathReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Add Audiobook Path
      tags:
      - Audiobooks
  /api/user/audiobook/path/{id}:
    delete:
      parameters:
      - description: Path ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Delete Audiobook Path
      tags:
      - Audiobooks
    put:
      consumes:
      - application/json
      parameters:
      - description: Path ID
        in: path
        name: id
        required: true
        type: integer
      - description: Path request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.PathReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Update Audiobook Path
      tags:
      - Audiobooks
  /api/user/audiobook/paths:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AudioPath'
            type: array
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get Audiobook Paths
      tags:
      - Audiobooks
  /api/user/audiobook/progress:
    post:
      consumes:
      - application/json
      parameters:
      - description: Progress request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ProgressReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Report Audiobook Progress
      tags:
      - Audiobooks
  /api/user/audiobook/stream/{name}:
    get:
      parameters:
      - description: Audiobook name (e.g. xyz.mp3)
        in: path
        name: name
        required: true
        type: string
      produces:
      - audio/mpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Stream Audiobook
      tags:
      - Audiobooks
  /api/user/config:
    get:
      description: Get all cloud configuration entries.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.CloudConfig'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: List Configs
      tags:
      - Config
  /api/user/config/{id}:
    put:
      consumes:
      - application/json
      description: Update a cloud configuration entry (value, enabled status, or soft-delete).
      parameters:
      - description: Config ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Update Config
      tags:
      - Config
  /api/user/document/read/file/{filepath}:
    get:
      description: Serve a text document file with appropriate MIME type.
      parameters:
      - description: Relative file path
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: file
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Serve Document
      tags:
      - Media
  /api/user/files/cancel:
    post:
      consumes:
      - application/json
      description: Cancel a running or queued file operation by its operation ID.
      parameters:
      - description: Cancel request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CancelReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Cancel Operation
      tags:
      - Files
  /api/user/files/check-duplicates:
    post:
      consumes:
      - application/json
      description: Check for name collision between source and destination paths.
      parameters:
      - description: Check duplicates request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CheckDuplicateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Check Duplicates
      tags:
      - Files
  /api/user/files/check-upload-duplicates:
    post:
      consumes:
      - application/json
      description: Check for file name collision when uploading files to a destination.
      parameters:
      - description: Check upload duplicates request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CheckUploadDuplicateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Check Upload Duplicates
      tags:
      - Files
  /api/user/files/copy:
    post:
      consumes:
      - application/json
      description: Start an asynchronous copy operation for files/directories.
      parameters:
      - description: Copy request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CopyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
